[project]
name = "microsoft-graph-api"
version = "0.1.0"
description = "Obsidian -> SharePoint publisher (MathML LaTeX, native Pages API)"
readme = "README.md"
authors = [
    { name = "martinko-pc995-btw", email = "martin@michalec.it" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "cryptography>=43.0.0",
    "markdown>=3.7",
    "msal>=1.31.0",
    "pillow>=10.4.0",
    "playwright>=1.48.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.32.0",
    "ziamath>=0.13",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
]

[project.scripts]
microsoft-graph-api = "microsoft_graph_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

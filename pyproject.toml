dependencies = [
    "attr==0.3.2",
    "backports-statistics==0.1.0",
    "configparser==7.2.0",
    "cryptography==48.0.0",
    "docutils==0.23",
    "fastapi==0.136.3",
    "filelock==3.29.0",
    "h2==4.3.0",
    "htmlparser==0.0.2",
    "ipython==9.13.0",
    "ipywidgets==8.1.8",
    "jnius==1.1.0",
    "js==1.0",
    "keyring==25.7.0",
    "lzstring==1.0.4",
    "markdown==3.10.2",
    "msal==1.34.0",
    "pillow==12.2.0",
    "playwright==1.60.0",
    "pydantic==2.13.4",
    "pyopenssl==26.2.0",
    "pyperclip==1.11.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "redis==8.0.0",
    "requests-oauthlib==2.0.0",
    "selenium==4.44.0",
    "sphinx==9.1.0",
    "thread==2.0.6",
    "tkcalendar==1.6.1",
    "typing-extensions==4.15.0",
    "webdriver-manager==4.0.2",
    "win11toast==0.36.2",
    "xmlrpclib==1.0.1",
